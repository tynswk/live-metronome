<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metronome">
<meta name="theme-color" content="#0b0b0d">
<title>Live Metronome</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4.5v15l13-7.5z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24" class="stroke"><path d="M5 12h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" class="stroke"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" class="stroke"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.08A1.7 1.7 0 0 0 10.1 3.04V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.14 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" class="stroke"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-chevL" viewBox="0 0 24 24" class="stroke"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-chevR" viewBox="0 0 24 24" class="stroke"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" class="stroke"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24" class="stroke"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5v-2a1.5 1.5 0 1 1 3 0V12"/><path d="M14 10.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6v-2a1.5 1.5 0 0 1 3 0"/></symbol>
</defs></svg>

<div id="stage">
  <section id="pdfPane" hidden>
    <div id="pdfScroll"><div id="pdfDoc"></div></div>
    <div id="pdfBar">
      <button class="icn" id="pgPrev" aria-label="前のページ"><svg><use href="#i-chevL"/></svg></button>
      <span id="pgLabel">–</span>
      <button class="icn" id="pgNext" aria-label="次のページ"><svg><use href="#i-chevR"/></svg></button>
      <button class="icn" id="scrollToggle" aria-label="自動スクロール"><svg><use href="#i-chevR"/></svg></button>
    </div>
  </section>

  <div id="divider" hidden><span></span></div>

  <section id="flashPane">
    <div id="hud">
      <div id="bpmBig">120</div>
      <div id="meterLabel">4/4</div>
      <div id="dots"></div>
      <div id="presetName"></div>
    </div>
  </section>
</div>

<footer id="bar">
  <div id="presets"></div>
  <div id="transport">
    <button class="icn big" id="bpmDown" aria-label="BPM−"><svg><use href="#i-minus"/></svg></button>
    <button class="icn big" id="playBtn" aria-label="開始/停止"><svg><use href="#i-play"/></svg></button>
    <button class="icn big" id="bpmUp" aria-label="BPM＋"><svg><use href="#i-plus"/></svg></button>
    <button class="icn big" id="tapBtn" aria-label="タップテンポ"><svg><use href="#i-hand"/></svg></button>
    <button class="icn big" id="openSettings" aria-label="設定"><svg><use href="#i-settings"/></svg></button>
  </div>
</footer>

<div id="scrim" hidden></div>

<div id="sheet" hidden>
  <header>
    <h2>設定</h2>
    <button class="icn" id="closeSettings" aria-label="閉じる"><svg><use href="#i-close"/></svg></button>
  </header>
  <div class="sheetBody">

    <div class="grp">
      <div class="row"><label for="bpmRange">BPM</label><output id="bpmOut">120</output></div>
      <input type="range" id="bpmRange" min="20" max="300" step="1" value="120">
    </div>

    <div class="grp">
      <div class="row"><label>拍子</label><span id="meterOut">4/4</span></div>
      <div class="stepper">
        <button class="icn" id="beatsDown"><svg><use href="#i-minus"/></svg></button>
        <span id="beatsVal">4</span>
        <button class="icn" id="beatsUp"><svg><use href="#i-plus"/></svg></button>
        <div class="seg" id="unitSeg">
          <button data-unit="4">4分</button>
          <button data-unit="8">8分</button>
          <button data-unit="12">付点4分</button>
        </div>
      </div>
      <p class="hint">拍のマスをタップ：強 → 弱 → 無音</p>
      <div id="accentEdit"></div>
    </div>

    <div class="grp">
      <div class="row"><label>刻み</label></div>
      <div class="seg" id="divSeg">
        <button data-div="1">なし</button>
        <button data-div="2">2</button>
        <button data-div="3">3</button>
        <button data-div="4">4</button>
      </div>
    </div>

    <div class="grp">
      <div class="row"><label for="soundOn">音を出す</label><input type="checkbox" id="soundOn" class="sw"></div>
      <div class="row"><label for="volRange">音量</label><output id="volOut">80</output></div>
      <input type="range" id="volRange" min="0" max="100" step="1" value="80">
    </div>

    <div class="grp">
      <div class="row"><label>色</label></div>
      <div class="colors">
        <label>1拍目<input type="color" id="colAccent"></label>
        <label>他の拍<input type="color" id="colBeat"></label>
        <label>地色<input type="color" id="colBg"></label>
      </div>
      <div class="row"><label for="flashOnlyAccent">1拍目だけ光らせる</label><input type="checkbox" id="flashOnlyAccent" class="sw"></div>
      <div class="row"><label for="flashLen">光る長さ</label><output id="flashLenOut">50%</output></div>
      <input type="range" id="flashLen" min="10" max="95" step="5" value="50">
    </div>

    <div class="grp">
      <div class="row"><label for="restartOnSwitch">プリセット切替で1拍目から</label><input type="checkbox" id="restartOnSwitch" class="sw"></div>
      <div class="row"><label for="keepAwake">画面を消さない</label><input type="checkbox" id="keepAwake" class="sw"></div>
      <div class="row"><label for="tapToToggle">画面タップで開始/停止</label><input type="checkbox" id="tapToToggle" class="sw"></div>
    </div>

    <div class="grp">
      <div class="row"><label>PDF譜面</label></div>
      <div class="btnRow">
        <label class="btn"><svg><use href="#i-file"/></svg>読み込む<input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden></label>
        <button class="btn" id="pdfClear">外す</button>
        <button class="btn" id="pdfSwap">位置を入替</button>
      </div>
      <div class="row"><label for="scrollSpeed">自動スクロール</label><output id="scrollOut">0</output></div>
      <input type="range" id="scrollSpeed" min="0" max="120" step="2" value="0">
      <p class="hint" id="pdfNote"></p>
    </div>

    <div class="grp">
      <div class="row"><label>プリセット</label></div>
      <p class="hint">下のプリセットを長押しで編集。現在の設定を保存できます。</p>
      <button class="btn" id="resetAll">すべて初期化</button>
      <p class="hint" id="ver"></p>
    </div>

  </div>
</div>

<div id="editor" hidden>
  <div class="card">
    <h3 id="edTitle">プリセット</h3>
    <label class="fld">名前<input type="text" id="edName" maxlength="14" placeholder="曲名"></label>
    <label class="fld">BPM<input type="number" id="edBpm" min="20" max="300" inputmode="numeric"></label>
    <label class="fld">拍数<input type="number" id="edBeats" min="1" max="16" inputmode="numeric"></label>
    <div class="fld">音価
      <div class="seg" id="edUnitSeg">
        <button data-unit="4">4分</button><button data-unit="8">8分</button><button data-unit="12">付点4分</button>
      </div>
    </div>
    <div class="btnRow">
      <button class="btn" id="edFromNow">今の設定を入れる</button>
      <button class="btn" id="edClear">空にする</button>
    </div>
    <div class="btnRow end">
      <button class="btn" id="edCancel">キャンセル</button>
      <button class="btn primary" id="edSave">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
